<text x="400" y="815" text-anchor="middle" font-family="Georgia,serif" font-size="46" letter-spacing="12" fill="#e5c47c">PRODUCTIONS</text>
<text x="400" y="870" text-anchor="middle" font-family="Arial,sans-serif" font-size="20" letter-spacing="6" fill="#b89b65">IMAGINE IT. BUILD IT. MAKE IT REAL.</text>
