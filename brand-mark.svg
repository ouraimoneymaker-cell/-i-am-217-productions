<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1000" role="img" aria-labelledby="title desc">
<title id="title">I Am 217 Productions</title>
<desc id="desc">Black and gold 217 Productions emblem with triangle, flame, and infinity mark.</desc>
<defs>
  <radialGradient id="bg" cx="50%" cy="32%" r="75%">
    <stop offset="0" stop-color="#17120b"/>
    <stop offset=".62" stop-color="#080808"/>
    <stop offset="1" stop-color="#050505"/>
  </radialGradient>
  <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#f4d797"/>
    <stop offset=".45" stop-color="#d1a24d"/>
